# Aggressive preset — minimum always-on, heavy trigger gating.
# Default for messaging channels (Telegram, Slack, Discord, etc.).
# Keeps the resident messaging loadout small; telemetry records actual savings.

name: aggressive
# Documentation only — nothing reads `description`; the loader consumes
# `name`, `always_carry`, `carry`, and `triggers`.
description: >
  Minimum always-on; everything else trigger-gated. Best for short conversational
  channels. The model can call `expand_tools(category=...)` if it needs something
  that wasn't loaded.

# Between-session shaper defaults. `scripts/shape-ceiling.py` inherits these
# values unless explicit CLI flags override them for an ad-hoc run.
learning:
  shape_ceiling:
    session_window: 20
    promote_min_sessions: 2
    promote_min_calls: 3
    demote_min_sessions_no_use: 20

# ── Resident partition (Tool Belt 1.0 carrying model) ─────────────────────────
# Hermes supplies the enabled built-in ceiling E each request. Tool Belt splits
# it into three classes:
#   A = always_carry ∩ E   immutable residents (win every conflict; never shaped)
#   C = carry ∩ E          adaptive residents (promotion/demotion move tools here)
#   X = E − (A ∪ C)        expand_only — the derived enabled remainder
# Promotion moves expand_only → carry; demotion moves carry → expand_only, and
# trigger definitions never change during either transition. Tool Belt has no
# disabling semantics: absent/disabled tools are owned by E, not by policy.

# always_carry — permanent residents. Discovery, planning, asking for help, plus
# the structural gateway/meta tools the agent must never lose. Immutable: the
# learned/adaptive layer can never demote these.
always_carry:
  - clarify
  - skill_view
  - skills_list
  - todo
  # Gateway essential — ignored on CLI by the plugin.
  - send_message
  # Always-on meta-tool the plugin itself adds.
  - expand_tools

# carry — adaptive residents. Resident by default; the learned overlay may
# demote a consistently-unused one to expand_only (and promote it back later).
carry:
  # Core Mnemosyne loop: recall first, remember what matters, invalidate stale
  # memories. session_search and the specialist/maintenance Mnemosyne surface
  # stay expand_only (see the history_search and mnemosyne_extended triggers).
  - mnemosyne_remember
  - mnemosyne_recall
  - mnemosyne_invalidate
  # Universal cheap tools.
  - web_search
  - read_file
  - search_files
  - process
  # Core action tools — resident so the agent can always act without an
  # expand_tools round trip (itself vulnerable to registration/ceiling issues).
  - terminal
  - write_file
  - patch

# NOTE — no always_off key. Tool Belt has no disabling semantics. Any enabled
# tool outside always_carry/carry is expand_only; disabling is owned by Hermes's
# ceiling.

# Triggered tool groups. Each group fires when ANY of its signals match.
# When a group fires, all listed tools are added to the active set.
# Multiple groups can fire on the same message (additive).
triggers:

  # File modifications — re-activates the write surface when it has been
  # demoted to expand_only; harmless while it is still resident (see `carry`).
  - name: file_write
    tools: [write_file, patch]
    keywords:
      - '\b(write|create|save|update|edit|editing|modify|patch|append|fix|change|delete|rewrite)\b'
      - '\.(md|py|js|ts|tsx|jsx|json|yaml|yml|toml|sh|html|css|sql|txt)\b'  # filename-with-extension
      - '/\S+\.\S+'        # path with extension
      - '~/\S+'            # home-relative path
    exclude_keywords:
      - '\b(should we|would we|could we|might|maybe|eventually|later|future)\b'
      - '\b(what do you think|talk through|approach|strategy|idea|thinking about)\b'
      - '\b(not asking you to|don[''’]t|do not)\b.*\b(write|edit|change|patch|save|commit)\b'
      - '^\s*>'
      - '```'

  # Shell — re-activates `terminal` when it has been demoted to expand_only;
  # harmless while it is still resident (see `carry`).
  - name: shell
    tools: [terminal]
    keywords:
      - '\b(run|install|execute|shell|terminal|build|deploy|test the|tests pass)\b'
      - '\b(brew|npm|yarn|pnpm|pip|pipx|uv|cargo|go|make|cmake|docker|kubectl|gh|git)\b'
      - '\$\s*\w+'         # shell prompt symbol

  # Python script with tool calls — for batch / processing intent
  - name: code_execution
    tools: [execute_code]
    keywords:
      - '\b(for each|loop (over|through)|process all|filter|aggregate|map over)\b'
      - '\b\d+\s+(pages|files|items|rows|records)\b'
      - '\b(fetch all|all of them|batch|in bulk)\b'
      - '\bwrite a (python|simple) script\b'

  # Subagent delegation — explicit worker/spawn intent
  - name: delegation
    tools: [delegate_task]
    keywords:
      - '\b(delegate|sub-?agents?|spawn|orchestrat(e|or))\b'
      - '\b(use|run|spin up|ask)\b.{0,40}\b(Claude Code|CC|worker|sub-?agent)\b'
      - '\b(in parallel|simultaneously|concurrent(ly)?)\b.{0,80}\b(do|run|work on|build|research|implement|fix)\b'
    exclude_keywords:
      - '\b(should we|would we|could we|might|maybe|eventually|later|future)\b'
      - '\b(idea|approach|strategy|thinking about|talk through|discussion)\b'
      - '\b(not yet|not now|don[''’]t delegate|do not delegate)\b'

  # Skill authoring — explicit capture intent
  - name: skills_authoring
    tools: [skill_manage]
    keywords:
      - '\bsave (this|that|it) as a skill\b'
      - '\b(capture|create|make|new|update|fix|patch|edit) (a |the )?skill\b'
      - '\bturn (this|that) into a skill\b'

  # Web content extraction — URL or scrape intent
  - name: web_extract
    tools: [web_extract]
    keywords:
      - 'https?://\S+'                              # any URL
      - '\b(scrape|crawl|fetch from|extract from|content of)\b'
      - '\b(read|grab|pull) (the|this) (page|article|post|url)\b'

  # Vision — primarily attachment-driven
  - name: vision
    tools: [vision_analyze]
    has_attachment: image                            # primary signal — image present in event
    keywords:
      - '\b(this (image|picture|photo|screenshot|diagram))\b'
      - '\bwhat(s| is)? (in|on) this\b'

  # Image generation
  - name: image_gen
    tools: [image_generate]
    keywords:
      - '\b(draw|illustrate|paint|sketch)\b'
      - '\b(generate|create|make) (an? )?(image|picture|photo|illustration|drawing|artwork)\b'
      - '\b(image|picture) of\b'

  # Text-to-speech
  - name: tts
    tools: [text_to_speech]
    keywords:
      - '\b(read (this )?(aloud|out loud)|say this|speak (this|it)|read it out|TTS|out loud)\b'
      - '\bvoice (over|this)\b'

  # Browser automation — Browser Use CLI mode exposes the browser surface as a
  # single `browser_exec` tool.
  - name: browser
    tools:
      - browser_exec
    keywords:
      - '\b(browse|navigate to|open .* in (a |the )?browser|browser automation)\b'
      - '\b(fill (out|in)|click on|select|hover|scroll)\b.*\b(form|page|button|link|element)\b'
      - '\bweb scrap'
      - '\bautomate.*browser\b'

  # Cronjob — scheduling intent
  - name: cronjob
    tools: [cronjob]
    keywords:
      - '\b(schedule|recurring|repeating)\b.*\b(task|job|check|run|send|reminder|notify|report)\b'
      - '\bremind me\b.*\b(every|daily|weekly|at|tomorrow|on monday|on tuesday|on wednesday|on thursday|on friday|on saturday|on sunday)\b'
      - '\bnotify me\b.*\b(daily|weekly|every|when|at)\b'
      - '\bset (a |an )?(alarm|reminder|timer)\b'
      - '\bcron(job)?\b.*\b(create|add|schedule|run|edit|remove|pause|resume)\b'
    exclude_keywords:
      - '\b(should we|would we|could we|might|maybe|eventually|later|future)\b'
      - '\b(how does|how do|what is|explain|talk through|approach)\b.*\b(cron|schedule|scheduled|reminder)\b'
      - '\b(I|we)\b.*\b(every day|daily|weekly)\b'

  # Home Assistant — smart home control
  - name: homeassistant
    tools: [ha_list_entities, ha_get_state, ha_list_services, ha_call_service]
    keywords:
      - '\b(turn (on|off)|switch (on|off)|toggle)\b.*\b(lights?|lamp|fan|outlet|plug|tv|switch|alarm)\b'
      - '\b(temperature|thermostat|climate)\b'
      - '\b(garage|door|gate|window|blinds)\b.*\b(open|close|lock|unlock)\b'
      - '\bhome ?assistant\b'
      - '\bhass(\.io)?\b'
      # Bare "HA" is the interjection far more often than the product, and the
      # keyword list compiles case-insensitively (`presets._compile_keywords`),
      # so the acronym only counts when it is upper-case *and* carries a
      # smart-home co-word.
      - '(?-i:\bHA\b).{0,30}\b(entit(y|ies)|state|service|automation|scene|sensor|lights?|switch)\b'
      - '\b(dim|brighten) (the )?lights?\b'

  # Note: tool_search / tool_describe / tool_call (Hermes' native deferred-
  # loading bridge) are NOT gated here. Tool Search manages its own
  # activation — it injects the bridge when MCP/plugin tools exist and
  # stays off when they don't.

  # Conversation-history search — pulling up prior sessions/turns.
  - name: history_search
    tools: [session_search]
    keywords:
      - '\bprevious conversation\b'
      - '\bpast session\b'
      - '\bwhat did we\b'
      - '\bremember when\b'
      - '\bsession search\b'
      # Bare "history" is git/browser/project history far more often than the
      # conversation log, so it needs a conversational qualifier.
      - '\b(chat|conversation|session|message|our|my)\s+history\b'
      - '\bsearch\b.{0,20}\bhistory\b'
    exclude_keywords:
      # …and the qualified forms still lose to an explicit non-conversation
      # history ("search the git history", "clear my browser history").
      - '\b(git|commit|revision|version|browser|shell|bash|command|file|edit|purchase|order|payment|medical)\s+histor(y|ies)\b'

  # Extended Mnemosyne surface — shared/canonical/triple/graph/sync/persona/
  # scratchpad/export/import/diagnose/etc. The core loop (remember, recall,
  # invalidate) is always-on; these specialist/maintenance tools load on
  # demand so they stop riding along as unknowns on every turn.
  - name: mnemosyne_extended
    tools:
      - mnemosyne_shared_remember
      - mnemosyne_shared_recall
      - mnemosyne_shared_forget
      - mnemosyne_shared_stats
      - mnemosyne_remember_canonical
      - mnemosyne_recall_canonical
      - mnemosyne_forget_canonical
      - mnemosyne_triple_add
      - mnemosyne_triple_query
      - mnemosyne_triple_end
      - mnemosyne_graph_query
      - mnemosyne_graph_link
      - mnemosyne_sync_push
      - mnemosyne_sync_pull
      - mnemosyne_sync_status
      - mnemosyne_persona_promote
      - mnemosyne_persona_demote
      - mnemosyne_persona_reinforce
      - mnemosyne_persona_list
      - mnemosyne_scratchpad_write
      - mnemosyne_scratchpad_read
      - mnemosyne_scratchpad_clear
      - mnemosyne_export
      - mnemosyne_import
      - mnemosyne_diagnose
      - mnemosyne_batch
      - mnemosyne_update
      - mnemosyne_forget
      - mnemosyne_get
      - mnemosyne_stats
      - mnemosyne_sleep
      - mnemosyne_validate
      - mnemosyne_task_progress
      - mnemosyne_model_card
      - mnemosyne_model_refresh
      - mnemosyne_apply_pending
      - mnemosyne_recall_diagnostics
    keywords:
      # This is the most expensive group in the policy, so every keyword has
      # to be unambiguous. Bare `sync`, `batch`, `graph`, `diagnose`,
      # `canonical` and `triple` are ordinary English in a working channel —
      # they only count next to a memory-domain co-word.
      - '\bmnemosyne\w*\b'
      - '\bshared memory\b'
      - '\bknowledge graph\b'
      - '\bpersona\b'
      - '\bscratchpad\b'
      - '\b(export|import)\s+(the\s+)?memor(y|ies)\b'
      - '\bmemor(y|ies)\b.{0,30}\b(sync|synced|syncing|graph|batch|export|import|diagnose|diagnostics?|canonical|triples?|stats|validate|sleep)\b'
      - '\b(sync|syncing|graph|batch|export|import|diagnose|diagnostics?|canonical|triples?)\b.{0,30}\bmemor(y|ies)\b'
