name: dynamic-tools
version: 2026.5.17-beta
description: Narrow the tool definitions sent to the model on each gateway message based on detected intent. Respects the user's existing platform_toolsets ceiling. Falls back to no-narrowing on any failure.
author: Dale Mugford
provides_tools:
  - expand_tools
provides_hooks:
  - pre_gateway_dispatch
  - post_tool_call
  - on_session_end
