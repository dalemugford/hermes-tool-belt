name: tool-belt
display_name: Hermes Tool Belt
version: 2026.5.17-beta
description: Adaptive tool loadouts for agents. Carry only what you need, drop the rest. Sharpens with use.
long_description: Picks the tool set per session under prefix-cache-friendly providers (Anthropic, OpenAI), per turn under cache-off providers. Learns from real expand_tools events what to promote into future sessions. Respects the user's existing platform_toolsets ceiling. Falls back to no-narrowing on any failure.
author: Dale Mugford
provides_tools:
  - expand_tools
provides_hooks:
  - pre_gateway_dispatch
  - post_tool_call
  - on_session_end
