name: tool-belt
label: Hermes Tool Belt
kind: standalone
version: 2026.5.17-beta
manifest_version: 2
api_version: 1
description: >
  Adaptive, cache-aware tool loadouts for Hermes agents. Narrows the configured
  tool ceiling safely, restores tools on demand, and learns between sessions.
author: Dale Mugford
license: MIT
homepage: https://github.com/dalemugford/hermes-tool-belt
tags: [tools, prompt-caching, optimization, telemetry]
provides_tools:
  - expand_tools
provides_hooks:
  - pre_gateway_dispatch
  - post_tool_call
  - post_api_request
  - on_session_end
  - on_session_reset
