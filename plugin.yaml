name: tool-belt
label: Hermes Tool Belt
kind: standalone
version: 2026.9.5
manifest_version: 2
api_version: 1
description: >
  Adaptive, cache-aware tool loadouts for Hermes agents. Narrows the configured
  tool ceiling safely, restores tools on demand, and learns between sessions.
author: Dale Mugford
license: MIT
homepage: https://github.com/dalemugford/hermes-tool-belt
tags: [tools, prompt-caching, optimization, telemetry]
python_dependencies:
  - "PyYAML>=6.0,<7"
# Settings live at plugins.entries.tool-belt.settings.* (Hermes' reserved
# plugin-settings subtree). Every top-level key is declared here; Hermes
# type-checks the block at gateway load (warnings, never load failures).
# Per-channel overrides nest as channels.<agent>.<platform>.{learned_mode,
# bypass_rate,always_carry,auto_shape_interval_hours}; see
# docs/CONFIGURATION.md. Defaults mirror _CONFIG in __init__.py (locked by
# tests/test_config_path.py).
config_schema:
  enabled:
    type: bool
    default: true
    description: Master switch; false makes the plugin a no-op.
  log:
    type: bool
    default: true
    description: Write telemetry JSONL under state/tool-belt.
  agent:
    type: str
    description: Display name for this profile's agent in reports.
  learned_mode:
    type: str
    default: apply
    description: apply (shape automatically) or recommend (observe only).
  auto_shape:
    type: bool
    default: true
    description: Periodic in-process auto-shaping for apply-mode scopes.
  auto_shape_interval_hours:
    type: number
    default: 24
    description: Per-scope debounce between automatic shaping passes.
  cache_mode:
    type: str
    default: auto
    description: auto | on | off — prompt-cache posture. on = carry the full ceiling (no expand_tools, zero mid-session mutation) for caching providers; off = per-turn narrowing with expand_tools; auto = detect per scope|provider.
  always_carry:
    type: list
    description: Tools pinned into every manifest; never shaped.
  bypass_rate:
    type: number
    default: 0.0
    description: Internal testing feature — fraction of sessions shipped unnarrowed.
  cache_off:
    type: dict
    description: Cache-off pipeline (sticky residency, predictor lookback).
  cache_auto:
    type: dict
    description: Cache-mode auto-detection thresholds.
  learning:
    type: dict
    description: >
      User-layer shaper thresholds. learning.shape_ceiling.<key> overrides the
      shipped policy.yaml defaults: window_days (7 — the recency window, in
      days), promote_min_sessions (1), promote_min_calls (2),
      demote_min_sessions_no_use (2), demote_k (1.5).
      Whole-profile; per-scope overrides are not supported.
      See docs/CONFIGURATION.md.
  channels:
    type: dict
    description: Per-channel overrides, nested channels.<agent>.<platform>.
provides_tools:
  - expand_tools
provides_hooks:
  - pre_gateway_dispatch
  - post_tool_call
  - post_api_request
  - on_session_end
  - on_session_reset
