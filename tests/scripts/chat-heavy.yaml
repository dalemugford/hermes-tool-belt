# Demote arm — a conversational agent with almost no tool use.
#
# Demotion needs resident tools that are NOT structurally protected, so the
# fixture models the demotable class: adaptive `carry` residents (partition
# class C) that go unused. The
# seeder maps these `unknown_kept` fixture tools into `carry_tools` on every
# prediction row; the shaper demotes an unused one to expand_only
# (shape-ceiling.py demote path).
#
# `weather_lookup` and `unit_convert` are named nowhere in policy.yaml (not in
# always_carry/carry, not in any trigger group); the seeder folds them into
# `carry_tools`, so under the 1.0 model they are ordinary adaptive residents.
# Because `calls` never names them they go 20 sessions unused and demote to
# expand_only — as does every other unused `carry` resident. Shaping only ever
# moves tools between `carry` and `expand_only`; the immutable `always_carry`
# surface is excluded from demotion by construction (no protected-mirror list
# is consulted any more).
name: chat-heavy
agent: testagent
platform: slack
profile: null
sessions: 20
unknown_kept:
  - weather_lookup
  - unit_convert
turns:
  - user: "what did we decide about pricing yesterday?"
    expect_triggers: [history_search]
    calls:
      - mnemosyne_recall
  - user: "draft a reply to that email"
    expect_triggers: []
    calls: []
