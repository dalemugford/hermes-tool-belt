# Sub-threshold state. Five sessions is below `required_sessions()`
# (max(promote_min_sessions, demote_min_sessions_no_use) = 20 from
# policy.yaml), which is the only way to reach `fresh` and `observing` —
# both states are unreachable from a 20-session script by definition.
name: observing
agent: testagent
platform: telegram
profile: null
sessions: 5
turns:
  - user: "what did we decide about pricing yesterday?"
    expect_triggers: [history_search]
    calls:
      - mnemosyne_recall
  - user: "how are things going today?"
    expect_triggers: []
    calls: []
