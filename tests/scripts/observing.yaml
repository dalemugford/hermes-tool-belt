# Sub-threshold state: the short conversation behind `fresh` and `observing`,
# the two states a scope can only be in while it has fewer sessions than
# `required_sessions()` (max(promote_min_sessions, demote_min_sessions_no_use)
# — 2 under the shipped policy.yaml). The count below is the script's natural
# length; a test that needs to be strictly under the threshold passes
# `sessions_override` rather than depending on this number.
name: observing
agent: testagent
platform: telegram
profile: null
sessions: 5
turns:
  - user: "what did we decide about pricing yesterday?"
    expect_triggers: [history_search]
    calls:
      - mnemosyne_recall
  - user: "how are things going today?"
    expect_triggers: []
    calls: []
